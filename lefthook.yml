pre-push:
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: packages-audit
      run: pnpm audit
    - name: gitleaks
      run: docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner
    - name: react-doctor
      # --blocking warning: any diagnostic, whatever its severity, fails the push.
      run: npx react-doctor@latest --blocking warning
    - name: typecheck
      run: pnpm run typecheck
    - name: coverage-then-sonar
      # The scanner needs the lcov files generated by test:cov, so the two run in sequence.
      group:
        piped: true
        jobs:
          - name: test-coverage
            run: pnpm run test:cov
          - name: sonar
            # Scanner runs in Docker on the SonarQube compose network and reaches the
            # server by service name (localhost:9000 is not reachable from the container).
            run: docker run --rm --network sonarqube_default -e SONAR_HOST_URL=http://sonarqube:9000 -e SONAR_TOKEN="$SONARQUBE_LOCAL_USER_TOKEN" -v "$PWD:/usr/src" -v sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache sonarsource/sonar-scanner-cli:11
