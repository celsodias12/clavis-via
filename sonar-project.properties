sonar.projectKey=clavis-via
sonar.projectName=clavis-via
sonar.qualitygate.wait=true
# infra/ is tooling (like tests/): intentionally outside sonar.sources; its logic modules reach 100% via the Node test runner.
sonar.sources=mobile/src,api/src,web/src,packages/shared/src
sonar.tests=mobile/src,mobile/tests,api/src,api/tests,web/src,web/tests,packages/shared/src,packages/shared/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,**/android/**,**/ios/**,**/.wrangler/**,**/*.d.ts,**/i18n/locales/**,api/migrations/**,web/src/components/ui/**,web/src/lib/**,web/src/routeTree.gen.ts
sonar.typescript.tsconfigPaths=mobile/tsconfig.json,api/tsconfig.json,web/tsconfig.app.json,packages/shared/tsconfig.json
sonar.javascript.lcov.reportPaths=mobile/coverage/lcov.info,api/coverage/lcov.info,web/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.config.ts,**/*.config.js,**/src/@types/**,**/src/constants/**,**/src/i18n/**,web/src/routes/**,web/src/main.tsx
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8

# S2068 (hard-coded credentials) matches any constant whose name contains "password", but these
# constants hold translation keys, Clerk error codes and test ids, never credentials.
# S6819 asks for <progress> in place of role="progressbar"; the progress bar is a styled track with a fill and a
# knob (the practice player), which a native <progress> cannot draw.
sonar.issue.ignore.multicriteria=passwordMobileConstants,passwordSharedConstants,progressBarRole
sonar.issue.ignore.multicriteria.passwordMobileConstants.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.passwordMobileConstants.resourceKey=mobile/src/constants/**
sonar.issue.ignore.multicriteria.passwordSharedConstants.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.passwordSharedConstants.resourceKey=packages/shared/src/constants/**
sonar.issue.ignore.multicriteria.progressBarRole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.progressBarRole.resourceKey=web/src/components/progress-bar/**
